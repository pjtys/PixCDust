[tool.poetry]
name = "pixcdust"
version = "0.2.0"
description = ""
authors = ["zawadzl <lionel.zawadzki@cnes.fr>"]
readme = "README.md"
packages = [{include = "pixcdust"}]

license = "Apache 2.0" 
keywords = ["SWOT", "dggs", "hydroweb", "water", "hydrology", "inland water", "coastal", "scientific data", "search", "download", "cnes"]

[tool.poetry.urls]
Documentation = "https://pixcdust.readthedocs.io/en/latest/index.html"
#Changelog = 
Source = "https://github.com/SWOT-community/PixCDust/tree/master"


[tool.poetry.dependencies]
python = "~3.12"
numpy = ">=2.0, <3.0"
fiona = "^1.9.5"
pandas = "^2.2.0"
geopandas = "^1.1.3"
h3 = "^3.7.6"
astropy = "^8.0.0"
astropy-healpix = "^1.1.0"
xarray = "^2024.2.0"
shapely = "^2.0.3"
click = "^8.1.7"
zcollection = "^2026.6.0"
netcdf4 = "^1.6.5"
tqdm = "^4.66.4"
pyogrio = "^0.8.0"
pyarrow = "^16.1.0"
py-hydroweb = "^1.2.0"
folium = "^0.16.0"
branca = "^0.7.2"
xvec = "^0.3.0"
eodag = "^4.4.0"
xdggs = "^0.6.0"
scipy = "^1.18.0"


[tool.poetry.group.dev.dependencies]
decorator = "^5.1.1"
ipykernel = "^6.29.4"
matplotlib = "^3.9.0"
pytest = "^9.1.1"
black = "^26.5.1"
flake8 = "^7.3.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
gitpython = "*"
sphinx = "*"
sphinx-rtd-theme = "*"
pydata-sphinx-theme = "*"
sphinx-autodoc-typehints = "*"
nbsphinx = "*"
sphinx-autoapi = "*"
ipykernel = "*"
sphinx-collections = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
